<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>离线复刻·可视化后台</title>
<style>
:root{font-family:"Microsoft YaHei",sans-serif;color-scheme:dark;--bg:#11151c;--panel:#1c2430;--line:#354052;--gold:#f3bd5d;--text:#eef1f5;--muted:#9da9b8;--ok:#43c88b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:68px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#11151cf2;z-index:5}h1{font-size:20px;margin:0;color:var(--gold)}header span{color:var(--muted)}button,.btn{border:1px solid #735f39;background:#3a3021;color:#ffe1a6;border-radius:7px;padding:9px 15px;cursor:pointer}button.primary{background:#a66b16;color:white;border-color:#d39531}.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 68px)}nav{padding:18px 12px;border-right:1px solid var(--line);background:#151b24}nav button{display:block;width:100%;margin:0 0 8px;text-align:left;background:transparent;border-color:transparent;color:#bbc5d1}nav button.active{background:#293443;color:white;border-color:#44536a}main{padding:22px;min-width:0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}.toolbar input{min-width:260px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stat strong{display:block;font-size:28px;color:var(--gold)}.stat small,.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #303b4b;text-align:left;vertical-align:middle}th{color:#c8d2df;position:sticky;top:68px;background:var(--panel)}input,select,textarea{background:#10151d;color:white;border:1px solid #3a4658;border-radius:6px;padding:8px;width:100%}input[type=checkbox]{width:auto}textarea{min-height:110px;font-family:Consolas,monospace}.thumb{width:56px;height:56px;object-fit:contain;background:#0b0e13;border:1px solid #303b4b;border-radius:5px}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.asset{min-width:0;background:#151b24;border:1px solid var(--line);padding:9px;border-radius:8px}.asset img{width:100%;height:110px;object-fit:contain;background:#0b0e13}.asset code{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;margin-top:6px}.hide{display:none}.ok{color:var(--ok)}.danger{color:#ff7b7b}.tabs{display:flex;gap:8px}.help{line-height:1.75;color:#bdc6d2}pre{white-space:pre-wrap;word-break:break-all}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#253243;color:#cfe0f3;margin:2px}.thumb{cursor:pointer}.asset-actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.asset-actions a,.asset-actions button{font-size:12px;padding:6px 8px;text-decoration:none}.skill-owner{min-width:130px}.skill-type{color:var(--gold);font-weight:bold}.preview-link{display:inline-flex;flex-direction:column;gap:4px;color:#9dc8ff;text-decoration:none}.preview-link small{max-width:110px;overflow:hidden;text-overflow:ellipsis}.section-title{color:var(--gold);margin:12px 0 4px}
</style></head><body>
<header><h1>离线复刻·可视化后台</h1><span id="status">正在读取电脑端数据……</span><button class="primary" onclick="saveAll()">保存全部修改</button><button onclick="openGame()">在游戏中预览</button></header>
<div class="shell"><nav id="nav"></nav><main id="main"></main></div>
<script>
const sections=[['dashboard','总览'],['heroes','武将与人物'],['skills','技能与解锁'],['beauties','美人与美人技能'],['skins','皮肤'],['equips','装备'],['formation','我方阵容'],['enemy','敌方阵容'],['world','世界地图'],['systems','功能开关与奖励'],['assets','全部美术资源'],['aliases','资源替换映射'],['raw','高级 JSON']];
let save={},cfg={},catalog={heroes:[],skills:[],beauties:[],beautySkills:[],skins:[],equips:[]},section=location.hash.slice(1)||'dashboard',assetPage=1,assetQuery='';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const assetUrl=key=>key?'/asset-by-key/'+encodeURIComponent(String(key).replace(/_png$/,'')):'';
const openAsset=key=>{if(key)window.open(assetUrl(key),'_blank')};
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()}
async function init(){[save,cfg,catalog]=await Promise.all([api('/api/save'),api('/api/config'),api('/api/runtime-catalog')]);save=save||{};cfg=cfg||{};catalog=catalog||{};defaults();renderNav();render();$('#status').textContent='已连接电脑端服务器';$('#status').className='ok'}
function defaults(){cfg.meta??={version:1,name:'离线复刻可编辑配置'};cfg.heroes??={};cfg.skills??={};cfg.skins??={};cfg.equips??={};cfg.world??={challengePowerCost:10,challengeRewards:{gold:5000,iron:10,pill:3},moneyTree:{freeTimes:3,buyTimes:10,baseGold:10000,multiplier:1}};cfg.battle??={enemyCount:8,difficulty:'normal',scenario:'yellow',enemySubTypes:[],enemyRaces:[1,2,3,4,5,6],enemyFormations:[]};cfg.battle.enemyRaces??=[1,2,3,4,5,6];cfg.battle.enemyFormations??=[];cfg.battle.beautyCode??=120000001;cfg.battle.beautySkillLevel??=1;cfg.features??={worldChallenge:true,moneyTree:true,heroInfo:true,skills:true,skins:true,equipment:true,handbook:true,worldMap:true,battle:true};cfg.assetAliases??={}}
function renderNav(){nav.innerHTML=sections.map(x=>`<button data-s="${x[0]}" class="${section===x[0]?'active':''}">${x[1]}</button>`).join('');nav.onclick=e=>{let b=e.target.closest('button');if(!b)return;section=b.dataset.s;location.hash=section;renderNav();render()}}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function render(){({dashboard:dash,heroes,skills,beauties,skins,equips,formation,enemy:enemyV17,world,systems,assets,aliases,raw}[section]||dash)()}
function dash(){main.innerHTML=`<div class="grid">${[['武将',catalog.heroes?.length||save.heroes?.length||0],['技能',catalog.skills?.length||0],['皮肤',catalog.skins?.length||0],['装备',save.equips?.length||0],['世界单位',save.world?.nativeUnits?.length||0],['已映射资源',Object.keys(cfg.assetAliases).length]].map(x=>`<div class="card stat"><strong>${x[1]}</strong><small>${x[0]}</small></div>`).join('')}</div>${card('使用方式','<div class="help">后台和游戏共用电脑端存档与配置。修改后点击“保存全部修改”，再重新进入相应游戏页面。武将信息、战斗参数、地图奖励、功能开关和美术资源映射都由该配置覆盖原生数据。</div>')}`}
function heroRows(){return (catalog.heroes||[]).map(h=>{let o=cfg.heroes[h.subType]||{},avatar=o.avatar??h.avatar??'';return `<tr><td>${h.subType}</td><td><a class="preview-link" href="${assetUrl(avatar)}" target="_blank" title="点击打开原图"><img class="thumb" src="${assetUrl(avatar)}"><small>打开原图</small></a></td><td><input data-hero="${h.subType}" data-k="name" value="${esc(o.name??h.name)}"></td><td><select data-hero="${h.subType}" data-k="race">${[1,2,3,4,5,6].map(v=>`<option value="${v}" ${(o.race??h.race)==v?'selected':''}>${['','魏','蜀','吴','群','神','魔'][v]}</option>`).join('')}</select></td><td><input data-hero="${h.subType}" data-k="profession" type="number" value="${o.profession??h.profession??1}"></td><td><input data-hero="${h.subType}" data-k="avatar" value="${esc(avatar)}"><a href="${assetUrl(avatar)}" target="_blank">打开头像</a></td><td><input data-hero="${h.subType}" data-k="model" value="${esc(o.model??h.model??'')}"><a href="${assetUrl(o.model??h.model??'')}" target="_blank">打开模型文件</a></td><td><textarea data-hero="${h.subType}" data-k="definition">${esc(o.definition??h.definition??'')}</textarea></td></tr>`}).join('')}
function heroes(){main.innerHTML=`<div class="toolbar"><input id="filter" placeholder="搜索名称、编号、模型"><span>${catalog.heroes?.length||0} 名人物</span></div><div class="card" style="overflow:auto;max-height:calc(100vh - 145px)"><table><thead><tr><th>ID</th><th>预览</th><th>名称</th><th>所属国</th><th>职业</th><th>头像资源</th><th>模型</th><th>人物信息</th></tr></thead><tbody id="heroBody">${heroRows()}</tbody></table></div>`;bindHero();$('#filter').oninput=e=>{let q=e.target.value.toLowerCase();[...$('#heroBody').rows].forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(q))}}
function bindHero(){main.querySelectorAll('[data-hero]').forEach(el=>el.onchange=()=>{let id=el.dataset.hero;cfg.heroes[id]??={};cfg.heroes[id][el.dataset.k]=el.type==='number'||el.tagName==='SELECT'?Number(el.value):el.value})}
function editableTable(kind,cols,readOnly){let rows=(catalog[kind]||[]).map(x=>{let o=cfg[kind]?.[x.code]||{};return `<tr>${cols.map(c=>`<td>${readOnly.includes(c)?esc(x[c]):`<input data-kind="${kind}" data-code="${x.code}" data-field="${c}" value="${esc(o[c]??x[c]??'')}">`}</td>`).join('')}</tr>`}).join('');main.innerHTML=`<div class="toolbar"><input id="filter" placeholder="搜索当前表"><span>${catalog[kind]?.length||0} 条；表格中可直接编辑</span></div><div class="card" style="overflow:auto;max-height:calc(100vh - 145px)"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="tb">${rows}</tbody></table></div>`;$('#filter').oninput=e=>{let q=e.target.value.toLowerCase();[...$('#tb').rows].forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(q))};main.querySelectorAll('[data-kind]').forEach(el=>el.onchange=()=>{let group=cfg[el.dataset.kind]||(cfg[el.dataset.kind]={}),item=group[el.dataset.code]||(group[el.dataset.code]={});item[el.dataset.field]=el.value})}
function beauties(){let bs=catalog.beauties||[],ss=catalog.beautySkills||[],chosen=Number(cfg.battle.beautyCode)||120000001,level=Math.max(1,Math.min(9,Number(cfg.battle.beautySkillLevel)||1));main.innerHTML=card('什么是美人技能',`<div class="help">美人是独立于六名武将之外的助战单位。在原配置中，美人通过布阵界面的“助战美人”槽位上阵；技能在战斗开始时自动释放，不占武将站位，也不属于普通攻击或怒气大招。升阶会提高技能等级。原包共有 ${bs.length} 名美人、${ss.length} 条分级技能配置。</div><div class="grid"><label>我方助战美人<select id="beautyCode"><option value="0">不上阵</option>${bs.map(b=>`<option value="${b.code}" ${chosen===Number(b.code)?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label><label>技能等级<select id="beautyLevel">${[1,2,3,4,5,6,7,8,9].map(v=>`<option value="${v}" ${level===v?'selected':''}>Lv.${v}</option>`).join('')}</select></label></div><p class="help">保存后重新进入本地阵容战，所选美人技能会显示在战斗总览的 BUFF 明细中，并按原配置解释其开场效果。</p>`)+bs.map(b=>{let skills=ss.filter(s=>Number(s.beautyCode)===Number(b.code)).sort((a,z)=>a.level-z.level);return card(`${chosen===Number(b.code)?'★ 当前助战 · ':''}${esc(b.name)}（${b.code}）`,`<div class="grid"><div><a href="${assetUrl(b.head1)}" target="_blank"><img class="thumb" src="${assetUrl(b.head1)}"></a><p>模型：<a href="${assetUrl(b.model)}" target="_blank">${esc(b.model)}</a></p></div><div><b>战斗定位</b><p>助战美人 · 开场自动技能</p><p>初始属性：${esc(JSON.stringify(b.initAttr||[]))}</p></div></div><table><thead><tr><th>等级</th><th>图标</th><th>技能名</th><th>作用</th><th>特效模型</th></tr></thead><tbody>${skills.map(s=>`<tr><td>Lv.${s.level}</td><td><a href="${assetUrl(s.icon)}" target="_blank"><img class="thumb" src="${assetUrl(s.icon)}"></a></td><td>${esc(s.name)}</td><td>${esc(s.desc)}</td><td><a href="${assetUrl(s.modelId)}" target="_blank">${esc(s.modelId||'无')}</a></td></tr>`).join('')}</tbody></table>`)}).join('');$('#beautyCode').onchange=e=>{cfg.battle.beautyCode=+e.target.value;render()};$('#beautyLevel').onchange=e=>{cfg.battle.beautySkillLevel=+e.target.value;render()}}
function skillType(s){return s.skillType||({1:'普通攻击',2:'怒气大招',3:'被动技能'}[Number(s.action)]||'其他技能')}function skills(){let groups={};(catalog.skills||[]).forEach(s=>(groups[s.heroName||'未关联武将']??=[]).push(s));let rows=Object.entries(groups).map(([owner,list])=>`<tr><td colspan="7"><h3 class="section-title">${esc(owner)} · ${list.length} 个技能</h3></td></tr>${list.map(s=>{let o=cfg.skills?.[s.code]||{},icon=o.icon??s.icon??'';return `<tr><td>${s.code}</td><td class="skill-owner">${esc(owner)}</td><td class="skill-type">${esc(skillType(s))}</td><td><a class="preview-link" href="${assetUrl(icon)}" target="_blank"><img class="thumb" src="${assetUrl(icon)}"><small>${esc(icon||'未配置')}</small></a></td><td><input data-kind="skills" data-code="${s.code}" data-field="name" value="${esc(o.name??s.name??'')}"></td><td><input data-kind="skills" data-code="${s.code}" data-field="icon" value="${esc(icon)}"></td><td><textarea data-kind="skills" data-code="${s.code}" data-field="desc">${esc(o.desc??s.desc??'')}</textarea></td></tr>`}).join('')}`).join('');main.innerHTML=`<div class="toolbar"><input id="filter" placeholder="搜索武将、技能类型、名称或编号"><span>${catalog.skills?.length||0} 条技能；已按所属武将分类</span></div><div class="card" style="overflow:auto;max-height:calc(100vh - 145px)"><table><thead><tr><th>编号</th><th>所属武将</th><th>技能类型</th><th>图标预览</th><th>名称</th><th>图标资源键</th><th>技能说明</th></tr></thead><tbody id="tb">${rows}</tbody></table></div>`;$('#filter').oninput=e=>{let q=e.target.value.toLowerCase();[...$('#tb').rows].forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(q))};main.querySelectorAll('[data-kind]').forEach(el=>el.onchange=()=>{let item=(cfg.skills[el.dataset.code]??={});item[el.dataset.field]=el.value})}function mediaTable(kind,cols,keyField){let rows=(catalog[kind]||[]).map(x=>{let o=cfg[kind]?.[x.code]||{},key=o[keyField]??x[keyField]??'';return `<tr><td>${x.code}</td><td><a class="preview-link" href="${assetUrl(key)}" target="_blank"><img class="thumb" src="${assetUrl(key)}"><small>打开原图</small></a></td>${cols.map(c=>`<td><input data-kind="${kind}" data-code="${x.code}" data-field="${c}" value="${esc(o[c]??x[c]??'')}">${['model','halfPic','avatar','icon'].includes(c)?`<a href="${assetUrl(o[c]??x[c]??'')}" target="_blank">打开文件</a>`:''}</td>`).join('')}</tr>`}).join('');main.innerHTML=`<div class="toolbar"><input id="filter" placeholder="搜索当前表"><span>${catalog[kind]?.length||0} 条；图片可点击打开原文件</span></div><div class="card" style="overflow:auto;max-height:calc(100vh - 145px)"><table><thead><tr><th>编号</th><th>预览</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="tb">${rows}</tbody></table></div>`;$('#filter').oninput=e=>{let q=e.target.value.toLowerCase();[...$('#tb').rows].forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(q))};main.querySelectorAll('[data-kind]').forEach(el=>el.onchange=()=>{let item=(cfg[el.dataset.kind][el.dataset.code]??={});item[el.dataset.field]=el.value})}function skins(){mediaTable('skins',['heroSubType','name','model','halfPic','avatar'],'avatar')}function equips(){mediaTable('equips',['name','type','icon','quality'],'icon')}
function formation(){let hs=save.heroes||[];let slots=save.formation||[];main.innerHTML=card('我方六人阵容',`<div class="grid">${[1,2,3,4,5,6].map(p=>`<label>阵位 ${p}<select data-pos="${p}"><option value="">空</option>${hs.map(h=>{let meta=(catalog.heroes||[]).find(x=>x.code===h.code)||{};return `<option value="${h.uuid}" ${slots.find(s=>s.pos===p)?.uuid===h.uuid?'selected':''}>${esc(meta.name||h.uuid)} Lv.${h.level}</option>`}).join('')}</select></label>`).join('')}</div>`);main.querySelectorAll('[data-pos]').forEach(x=>x.onchange=()=>{save.formation=(save.formation||[]).filter(s=>s.pos!==Number(x.dataset.pos)&&s.uuid!==x.value);if(x.value)save.formation.push({pos:Number(x.dataset.pos),uuid:x.value})})}
function enemy(){let forms=cfg.battle.enemyFormations||[],active=forms.find(x=>x.id===cfg.battle.activeEnemyFormationId),draft=active||cfg.battle,choices=(catalog.heroes||[]),ids=draft.enemySubTypes||[],races=draft.enemyRaces||[1,2,3,4,5,6],raceNames=['','魏','蜀','吴','群','神','魔'];main.innerHTML=card('多套敌方阵营',`<div class="toolbar"><label>当前阵营<select id="enemyFormation"><option value="">默认阵营</option>${forms.map(f=>`<option value="${esc(f.id)}" ${active&&active.id===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><button id="addEnemyFormation">复制为新阵营</button><button id="deleteEnemyFormation" ${active?'':'disabled'}>删除当前阵营</button></div><p class="help">可保存多套敌军并随时切换。每套阵营还能同时勾选多个势力，未指定的阵位会从所选势力中生成。</p>`)+card(active?'编辑：'+active.name:'编辑：默认阵营',`<div class="grid"><label>敌人数量<input id="enemyCount" type="number" min="1" max="6" value="${draft.enemyCount??4}"></label><label>难度<select id="difficulty"><option value="normal">普通</option><option value="hard">困难</option><option value="hell">炼狱</option></select></label><div><b>可用势力（可多选）</b><div>${[1,2,3,4,5,6].map(v=>`<label class="pill"><input type="checkbox" data-race="${v}" ${races.includes(v)?'checked':''}> ${raceNames[v]}</label>`).join('')}</div></div>${[0,1,2,3,4,5].map(i=>`<label>敌方阵位 ${i+1}<select data-enemy="${i}"><option value="">从所选势力随机</option>${choices.map(h=>`<option value="${h.subType}" ${ids[i]==h.subType?'selected':''}>${esc(h.name)} · ${raceNames[h.race]} (${h.subType})</option>`).join('')}</select></label>`).join('')}</div><p class="help">只会生成 1–6 个真实武将实体；源战报的 7、8 号调试占位已移除。</p>`);$('#difficulty').value=draft.difficulty||'normal';$('#enemyCount').onchange=e=>draft.enemyCount=Math.max(1,Math.min(6,+e.target.value));$('#difficulty').onchange=e=>draft.difficulty=e.target.value;main.querySelectorAll('[data-enemy]').forEach(x=>x.onchange=()=>{draft.enemySubTypes??=[];draft.enemySubTypes[+x.dataset.enemy]=x.value?+x.value:null});main.querySelectorAll('[data-race]').forEach(x=>x.onchange=()=>{draft.enemyRaces=[...main.querySelectorAll('[data-race]:checked')].map(v=>+v.dataset.race);if(!draft.enemyRaces.length){x.checked=true;draft.enemyRaces=[+x.dataset.race]}});$('#enemyFormation').onchange=e=>{cfg.battle.activeEnemyFormationId=e.target.value||null;render()};$('#addEnemyFormation').onclick=()=>{let name=prompt('新敌方阵营名称','敌军方案 '+(forms.length+1));if(!name)return;let copy=JSON.parse(JSON.stringify(draft));copy.id='enemy-'+Date.now();copy.name=name;forms.push(copy);cfg.battle.activeEnemyFormationId=copy.id;render()};$('#deleteEnemyFormation').onclick=()=>{if(!active)return;cfg.battle.enemyFormations=forms.filter(x=>x.id!==active.id);cfg.battle.activeEnemyFormationId=null;render()}}
function enemyV17(){
  let forms=cfg.battle.enemyFormations||[],active=forms.find(x=>x.id===cfg.battle.activeEnemyFormationId),draft=active||cfg.battle;
  let choices=catalog.heroes||[],ids=draft.enemySubTypes||[],races=draft.enemyRaces||[1,2,3,4,5,6],raceNames=['','魏','蜀','吴','群','神','魔'];
  let slots=[0,1,2,3,4,5,6,7].map(i=>`<label>敌方阵位 ${i+1}<select data-enemy="${i}"><option value="">从所选势力随机</option>${choices.map(h=>`<option value="${h.subType}" ${ids[i]==h.subType?'selected':''}>${esc(h.name)} · ${raceNames[h.race]} (${h.subType})</option>`).join('')}</select></label>`).join('');
  main.innerHTML=card('多套敌方阵营',`<div class="toolbar"><label>当前阵营<select id="enemyFormation"><option value="">默认阵营</option>${forms.map(f=>`<option value="${esc(f.id)}" ${active&&active.id===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><button id="addEnemyFormation">复制为新阵营</button><button id="deleteEnemyFormation" ${active?'':'disabled'}>删除当前阵营</button></div><p class="help">可保存多套敌军并随时切换；未指定的阵位会在每次战斗时按新种子随机生成。</p>`)+card(active?'编辑：'+active.name:'编辑：默认阵营',`<div class="grid"><label>敌人数量<input id="enemyCount" type="number" min="1" max="8" value="${draft.enemyCount??8}"></label><label>难度<select id="difficulty"><option value="normal">普通</option><option value="hard">困难</option><option value="hell">炼狱</option></select></label><div><b>可用势力（可多选）</b><div>${[1,2,3,4,5,6].map(v=>`<label class="pill"><input type="checkbox" data-race="${v}" ${races.includes(v)?'checked':''}> ${raceNames[v]}</label>`).join('')}</div></div>${slots}</div><p class="help">原包 test_skill 为八对八测试阵容（阵位 11–18）；本地敌军已恢复 1–8 人。</p>`);
  $('#difficulty').value=draft.difficulty||'normal';
  $('#enemyCount').onchange=e=>draft.enemyCount=Math.max(1,Math.min(8,+e.target.value));
  $('#difficulty').onchange=e=>draft.difficulty=e.target.value;
  main.querySelectorAll('[data-enemy]').forEach(x=>x.onchange=()=>{draft.enemySubTypes??=[];draft.enemySubTypes[+x.dataset.enemy]=x.value?+x.value:null});
  main.querySelectorAll('[data-race]').forEach(x=>x.onchange=()=>{draft.enemyRaces=[...main.querySelectorAll('[data-race]:checked')].map(v=>+v.dataset.race);if(!draft.enemyRaces.length){x.checked=true;draft.enemyRaces=[+x.dataset.race]}});
  $('#enemyFormation').onchange=e=>{cfg.battle.activeEnemyFormationId=e.target.value||null;render()};
  $('#addEnemyFormation').onclick=()=>{let name=prompt('新敌方阵营名称','敌军方案 '+(forms.length+1));if(!name)return;let copy=JSON.parse(JSON.stringify(draft));copy.id='enemy-'+Date.now();copy.name=name;forms.push(copy);cfg.battle.activeEnemyFormationId=copy.id;render()};
  $('#deleteEnemyFormation').onclick=()=>{if(!active)return;cfg.battle.enemyFormations=forms.filter(x=>x.id!==active.id);cfg.battle.activeEnemyFormationId=null;render()};
}
function world(){let w=cfg.world,m=w.moneyTree,r=w.challengeRewards;main.innerHTML=card('世界地图与挑战',`<div class="grid"><label>挑战行动力消耗<input data-w="challengePowerCost" type="number" value="${w.challengePowerCost}"></label><label>胜利铜钱<input data-r="gold" type="number" value="${r.gold}"></label><label>胜利玄铁<input data-r="iron" type="number" value="${r.iron}"></label><label>胜利进阶丹<input data-r="pill" type="number" value="${r.pill}"></label></div>`)+card('摇钱树',`<div class="grid"><label>每日免费次数<input data-m="freeTimes" type="number" value="${m.freeTimes}"></label><label>可购买次数<input data-m="buyTimes" type="number" value="${m.buyTimes}"></label><label>单次基础铜钱<input data-m="baseGold" type="number" value="${m.baseGold}"></label><label>收益倍率<input data-m="multiplier" type="number" step="0.1" value="${m.multiplier}"></label></div>`);main.querySelectorAll('[data-w]').forEach(x=>x.onchange=()=>w[x.dataset.w]=+x.value);main.querySelectorAll('[data-r]').forEach(x=>x.onchange=()=>r[x.dataset.r]=+x.value);main.querySelectorAll('[data-m]').forEach(x=>x.onchange=()=>m[x.dataset.m]=+x.value)}
function systems(){main.innerHTML=card('前端功能开关',`<div class="grid">${Object.entries(cfg.features).map(([k,v])=>`<label><input type="checkbox" data-feature="${k}" ${v?'checked':''}> ${k}</label>`).join('')}</div><p class="help">关闭的功能会在前端提示“已在后台停用”。挑战、摇钱树、英雄信息、技能、皮肤、装备、图鉴、地图和战斗均纳入该配置。</p>`);main.querySelectorAll('[data-feature]').forEach(x=>x.onchange=()=>cfg.features[x.dataset.feature]=x.checked)}
async function assets(){main.innerHTML=`<div class="toolbar"><input id="assetQ" value="${esc(assetQuery)}" placeholder="搜索全部图片、龙骨、字体、音效和配置"><button id="assetSearch">搜索</button><label class="btn">上传替换素材<input id="upload" type="file" accept="image/*" hidden></label></div><div id="assetResult" class="card">读取中……</div>`;$('#assetSearch').onclick=()=>{assetQuery=$('#assetQ').value;assetPage=1;loadAssets()};$('#upload').onchange=upload;loadAssets()}
async function loadAssets(){let d=await api(`/api/assets?q=${encodeURIComponent(assetQuery)}&page=${assetPage}&size=80`);assetPage=Math.min(d.pages,Math.max(1,d.page));$('#assetResult').innerHTML=`<p>${d.total} 份资源 · 第 ${d.page}/${d.pages} 页。图片直接显示；配置、龙骨、字体和音效提供源文件入口。</p><div class="assets">${d.items.map(a=>`<div class="asset">${a.type.startsWith('image/')?`<a href="${a.url}" target="_blank"><img src="${a.url}" title="点击查看原尺寸"></a>`:`<a class="preview-link" href="${a.url}" target="_blank"><div class="thumb">${esc(a.path.split('.').pop().toUpperCase())}<br>源文件</div></a>`}<code title="${esc(a.path)}">${esc(a.path)}</code><small>${esc(a.key||'')} · ${Math.round(a.size/1024)} KB</small><div class="asset-actions"><a class="btn" href="${a.url}" target="_blank">打开文件</a><button data-copy="${esc(a.path)}">复制路径</button><button data-use="${esc(a.path)}">用于替换</button></div></div>`).join('')}</div><div class="toolbar"><button onclick="assetPage=Math.max(1,assetPage-1);loadAssets()" ${d.page<=1?'disabled':''}>上一页</button><span>${d.page}/${d.pages}</span><button onclick="assetPage=Math.min(${d.pages},assetPage+1);loadAssets()" ${d.page>=d.pages?'disabled':''}>下一页</button></div>`;document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy));document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>useAsset(b.dataset.use))}
function useAsset(path){let key=prompt('输入要被替换的 RES 资源键（例如 head1_hero_077_01_png）');if(key){cfg.assetAliases[key]=path;section='aliases';renderNav();render()}}
async function upload(e){let f=e.target.files[0];if(!f)return;let data=await new Promise(r=>{let x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});let out=await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,data})});assetQuery='admin_uploads';loadAssets();alert('已上传：'+out.url)}
function aliases(){let entries=Object.entries(cfg.assetAliases);main.innerHTML=card('资源替换映射',`<p class="help">左侧是游戏原 RES 键，右侧是其他原资源键或已上传的文件路径。</p><table><thead><tr><th>原资源键</th><th>新资源/路径</th><th></th></tr></thead><tbody>${entries.map(([k,v],i)=>`<tr><td><input data-ak="${i}" value="${esc(k)}"></td><td><input data-av="${i}" value="${esc(v)}"></td><td><button data-del="${i}">删除</button></td></tr>`).join('')}<tr><td><input id="newKey" placeholder="RES 键"></td><td><input id="newVal" placeholder="资源键或 admin_uploads/文件"></td><td><button id="addAlias">添加</button></td></tr></tbody></table>`);$('#addAlias').onclick=()=>{if($('#newKey').value){cfg.assetAliases[$('#newKey').value]=$('#newVal').value;render()}};main.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{delete cfg.assetAliases[entries[+x.dataset.del][0]];render()})}
function raw(){main.innerHTML=card('高级 JSON 配置','<textarea id="rawCfg" style="min-height:65vh">'+esc(JSON.stringify(cfg,null,2))+'</textarea><button id="applyRaw">应用 JSON</button>')+card('存档 JSON','<textarea id="rawSave" style="min-height:35vh">'+esc(JSON.stringify(save,null,2))+'</textarea><button id="applySave">应用存档 JSON</button>');$('#applyRaw').onclick=()=>{cfg=JSON.parse($('#rawCfg').value);defaults();alert('已应用，请保存')};$('#applySave').onclick=()=>{save=JSON.parse($('#rawSave').value);alert('已应用，请保存')}}
async function saveAll(){try{await Promise.all([api('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)}),api('/api/save',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(save)})]);$('#status').textContent='保存成功；重新打开游戏页面后生效';$('#status').className='ok'}catch(e){$('#status').textContent='保存失败：'+e.message;$('#status').className='danger'}}
function openGame(){window.open('offline-launcher.html','_blank')}init().catch(e=>{$('#status').textContent='读取失败：'+e.message;$('#status').className='danger'});
</script></body></html>
