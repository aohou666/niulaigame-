    function loadScript(list, callback) {

    };

    function loadSingleScript(src, callback) {
        var s = document.createElement('script');

        s.src = src;

            s.parentNode.removeChild(s);
            s.removeEventListener('load', arguments.callee, false);
            callback();
        }, false);
        document.body.appendChild(s);
    };

    function exportHeroSkills() {
        try {
            var heroes = game.Config.pack.t_hero || {};
            var skills = game.Config.pack.t_skill_base || {};
            var rows = [];
            for (var key in heroes) {
                if (!Object.prototype.hasOwnProperty.call(heroes, key)) continue;
                var hero = heroes[key];
                if (!hero || !hero.name) continue;
                var slots = [
                    ["普攻", hero.normalSkill],
                    ["主动", hero.actSkill],
                    ["被动1", hero.posSkill1],
                    ["被动2", hero.posSkill2],
                    ["被动3", hero.posSkill3]
                ];
                slots.forEach(function (slot) {
                    var skill = skills[slot[1]];
                    if (!slot[1] || !skill) return;
                    rows.push({
                        heroCode: hero.code,
                        heroName: hero.name,
                        race: hero.race,
                        profession: hero.profession,
                        initStar: hero.initStar,
                        slot: slot[0],
                        skillId: skill.id,
                        skillName: skill.name,
                        action: skill.action,
                        angerCost: skill.angerCost,
                        level: skill.level,
                        desc: skill.desc,
                        tapDesc: skill.tapDesc
                    });
                });
            }
            var out = document.getElementById("codex-config-export");
            if (!out) {
                out = document.createElement("pre");
                out.id = "codex-config-export";
                out.style.display = "none";
                document.body.appendChild(out);
            }
            out.textContent = JSON.stringify({heroCount:Object.keys(heroes).length, skillCount:Object.keys(skills).length, rows:rows});
            var download = document.getElementById("codex-config-download");
            if (!download) {
                download = document.createElement("a");
                download.id = "codex-config-download";
                download.style.position = "fixed";
                download.style.left = "-9999px";
                download.textContent = "download hero skills";
                document.body.appendChild(download);
            }
            download.href = URL.createObjectURL(new Blob([out.textContent], {type:"application/json;charset=utf-8"}));
            download.download = "hero-skills.json";
            fetch("http://127.0.0.1:8788/export", {
                method: "POST",
                mode: "no-cors",
                headers: {"Content-Type": "text/plain;charset=utf-8"},
                body: out.textContent
            }).catch(function (err) {
                console.error("[OFFLINE] export post failed", err);
            });
            console.log("[OFFLINE] hero skill export ready", rows.length);
        } catch (err) {
            console.error("[OFFLINE] hero skill export failed", err);
        }
    }

                        game.GameMVC.playerPy.playerVip.vipLevel = 0;
                    }
                    var saveKey = "offlineReplicaSaveV1";

                        var json = JSON.stringify(data);

                            console.error("[OFFLINE] save server unavailable", error);

                    }

                        try {
                            var request = new XMLHttpRequest();
                            request.open("GET", "/api/save", false);
                            request.send();
                            if (request.status === 200 && request.responseText && request.responseText !== "null") {
                                return JSON.parse(request.responseText);
                            }
                        } catch (error) {
                            console.error("[OFFLINE] save server load failed", error);
                        }
                        try { return JSON.parse(localStorage.getItem(saveKey) || "null"); } catch (_) { return null; }
                    }
                    function loadOfflineAdminConfig() {
                        try {
                            var request = new XMLHttpRequest();
                            request.open("GET", "/api/config", false);
                            request.send();
                            if (request.status === 200 && request.responseText) return JSON.parse(request.responseText) || {};
                        } catch (error) { console.warn("[OFFLINE] admin config unavailable", error); }
                        return {};
                    }
                    function normalizeLocalAttr(raw) {
                        var value = raw;
                        try { if (typeof value === "string") value = JSON.parse(value || "{}"); } catch (_) { value = {}; }
                        if (Array.isArray(value)) {
                            var mapped = {};
                            value.forEach(function (pair) {
                                if (Array.isArray(pair) && pair.length > 1) mapped[pair[0]] = Number(pair[1]) || 0;
                            });
                            value = mapped;
                        }
                        return JSON.stringify(value && typeof value === "object" ? value : {});
                    }
                    function fillLocalAdvancedAttrs(attrs, hero, cfg) {
                        var star = Math.max(1, Number(hero.starLevel) || Number(cfg && cfg.initStar) || 1);
                        var tier = Math.max(1, Number(cfg && cfg.tier) || 1);
                        var level = Math.max(1, Number(hero.level) || 1);
                        var percentBase = 35 + star * 3 + tier * 5;
                        var advanced = {
                            11: percentBase + 35, 12: 450 + star * 5, 13: percentBase,
                            14: percentBase + 20, 15: percentBase, 16: percentBase,
                            17: percentBase, 18: percentBase, 19: percentBase, 20: 400 + tier * 20,
                            21: percentBase, 22: percentBase, 23: 20 + tier * 5,
                            24: 15 + tier * 5, 29: 25 + star * 2, 30: 25 + star * 2,
                            33: percentBase, 34: percentBase, 92: 10 + tier * 2,
                            93: 10 + tier * 2, 94: 25 + tier * 3
                        };
                        Object.keys(advanced).forEach(function (id) {
                            if (!Number(attrs[id])) attrs[id] = advanced[id];
                        });
                        var chaosBase = Math.max(5, Math.floor((level + star * 5) / 12));
                        [301, 302, 303, 304, 311, 312, 313, 314, 315, 316, 317, 318, 319, 320, 321, 333].forEach(function (id) {
                            if (!Number(attrs[id])) attrs[id] = chaosBase;
                        });
                        return attrs;
                    }
                    var offlineAdminConfig = loadOfflineAdminConfig();
                    window.OfflineAdminConfig = offlineAdminConfig;
                    var offlineFeatures = offlineAdminConfig.features || {};
                    if (offlineAdminConfig.heroes) {
                        Object.keys(config.HeroLO.Store).forEach(function (key) {
                            var heroCfg = config.HeroLO.Get(Number(key));
                            var override = heroCfg && offlineAdminConfig.heroes[String(heroCfg.subType)];
                            if (!override) return;
                            ["name", "avatar", "avatar2", "model", "halfPic", "definition", "activeSkillDesc", "pictureDraw"].forEach(function (field) {
                                if (override[field] !== undefined && override[field] !== "") heroCfg[field] = override[field];
                            });
                            ["race", "profession", "normalSkill", "actSkill", "posSkill1", "posSkill2", "posSkill3"].forEach(function (field) {
                                if (override[field] !== undefined && override[field] !== "") heroCfg[field] = Number(override[field]);
                            });
                        });
                    }
                    if (offlineAdminConfig.skills && game.Config.pack.t_skill_base) {
                        Object.keys(offlineAdminConfig.skills).forEach(function (code) {
                            var target = game.Config.pack.t_skill_base[code];
                            var source = offlineAdminConfig.skills[code];
                            if (!target || !source) return;
                            ["name", "icon", "skillIcon", "action", "desc", "tapDesc"].forEach(function (field) {
                                if (source[field] !== undefined && source[field] !== "") target[field] = source[field];
                            });
                        });
                    }
                    function applyStoreOverrides(storeConfig, overrides, textFields, numberFields) {
                        if (!storeConfig || !overrides) return;

                            var source = overrides[code];
                            if (!target || !source) return;
                            textFields.forEach(function (field) { if (source[field] !== undefined && source[field] !== "") target[field] = source[field]; });
                            numberFields.forEach(function (field) { if (source[field] !== undefined && source[field] !== "") target[field] = Number(source[field]); });
                        });
                    }
                    applyStoreOverrides(config.HeroDermaLO, offlineAdminConfig.skins, ["name", "model", "halfPic", "avatar"], []);
                    applyStoreOverrides(config.HeroEquipLO, offlineAdminConfig.equips, ["name", "icon"], ["quality", "color"]);
                    if (offlineAdminConfig.assetAliases && window.RES && !RES._offlineAliasPatched) {
                        var originalGetRes = RES.getRes.bind(RES);
                        var uploadedTextures = {};
                        RES.getRes = function (key) {
                            var target = offlineAdminConfig.assetAliases[key];
                            if (!target) return originalGetRes(key);
                            if (uploadedTextures[key]) return uploadedTextures[key];
                            return originalGetRes(String(target).replace(/^.*\//, "").replace(/\.[^.]+$/, "")) || originalGetRes(target) || originalGetRes(key);
                        };
                        Object.keys(offlineAdminConfig.assetAliases).forEach(function (key) {
                            var target = String(offlineAdminConfig.assetAliases[key] || "");
                            if (target.indexOf("/") >= 0 && /\.(png|jpg|jpeg|webp)$/i.test(target)) {
                                var url = target.charAt(0) === "/" ? target : "/" + target;
                                RES.getResByUrl(url, function (texture) { if (texture) uploadedTextures[key] = texture; }, null, RES.ResourceItem.TYPE_IMAGE);

                        RES._offlineAliasPatched = true;
                    }
                    if (window.OfflineSkillReferences) window.OfflineSkillReferences.install();
                    if (window.OfflineHitEvents) window.OfflineHitEvents.install();
                    if (window.OfflineNavigationState) window.OfflineNavigationState.install();

                    if (window.CharacterReskin) window.CharacterReskin.apply();
                    var offlineSave;
                    offlineSave = loadOfflineSaveData();
                    if(window.OfflineSkillReferences)OfflineSkillReferences.normalizeSave(offlineSave);
                    if(window.OfflineReadRPC)OfflineReadRPC.setSave(function(){return offlineSave;});
                    if (!offlineSave || !offlineSave.summoner || !offlineSave.player || !offlineSave.heroes || !offlineSave.formation) {
                        // Older phone shells could persist configuration before

                        var partialOfflineSave = offlineSave || {};

                            })

                    offlineSave.version = 18;
                    // V17 restores the original test encounter width (positions

                    // Nine shipped hero models have a normal-attack animation but

                    if (offlineSkillVisuals && !offlineSkillVisuals.common_skinskill_jiaxu_pg && offlineSkillVisuals.common_skill_chengong_02) {

                    } else if (offlineMode === "fight" && window.OfflineUI) {
                        OfflineUI.showBattleConfig({ state: offlineSave, save: saveOfflineReplica, config: config, game: game });
                    } else if (game.GameMVC.slgMed && game.SlgMediator && game.SlgMediator.SV) {
                        // The original map is a child of MainUI. Keep MainUI alive
                        // underneath so closing the map returns to the same logged-in
                        // shell and its hero/formation/battle navigation.
                        if (game.GameMVC.mainMed && game.MainMediator) {
                            game.GameMVC.mainMed.showSubView(game.MainMediator.SV.MAIN);
                        }
                        // Keep the recovered map and its native buttons. The offline
                        // debug hook now only injects local map data; it creates no UI.
                        if (game.SlgMainView) {
                            game.SlgMainView.prototype.initDebugView = function () {
                                var view = this;
                                var localGuildId = 1;
                                var py = view.proxy || game.GameMVC.slgPy;
                                if (!game.GameMVC.playerPy.playerGuild) game.GameMVC.playerPy.playerGuild = { guildId: localGuildId, name: "本地军团" };
                                localGuildId = Number(game.GameMVC.playerPy.playerGuild.guildId) || localGuildId;
                                if (!offlineSave.world.nativeUnits) offlineSave.world.nativeUnits = [];
                                offlineSave.world.defeatedEnemyIds = (offlineSave.world.defeatedEnemyIds || []).map(Number);
                                offlineSave.world.nativeUnits = offlineSave.world.nativeUnits.filter(function (unit) {
                                    return offlineSave.world.defeatedEnemyIds.indexOf(Number(unit.playerId)) < 0;
                                }).slice(0, 10);
                                offlineSave.world.units = (offlineSave.world.units || []).filter(function (unit) {
                                    return offlineSave.world.defeatedEnemyIds.indexOf(Number(unit.playerId)) < 0;
                                }).slice(0, 10);
                                function legalPosition(index) {
                                    var nodes = view._mapField && view._mapField._astarGraph && view._mapField._astarGraph.legalNode || [];
                                    if (nodes.length) {
                                        var node = nodes[(index * 97 + 31) % nodes.length];
                                        return { x: Number(node.y !== undefined ? node.y : node.x) || 10, y: Number(node.x !== undefined ? node.x : node.y) || 10 };
                                    }
                                    return { x: 10 + index * 2, y: 10 + index * 2 };
                                }
                                function makeUnit(enemy, label) {
                                    if (offlineSave.world.nativeUnits.length >= 10) {
                                        Utils.MsgUtils.addMidMsg("本地敌军与友军总数最多10队");
                                        return null;
                                    }
                                    var index = offlineSave.world.nativeUnits.length + 1;
                                    var position = legalPosition(index);
                                    var playerId = 80000000 + index;
                                    var unit = {
                                        avatar: "", blood: 100, campsitePos: position, curPos: position, expelDt: 0,
                                        fightCap: 100000 + offlineSave.progress.stage * 10000 + index * 5000, frame: "",
                                        guildId: enemy ? localGuildId + 1 : localGuildId,
                                        moveInfo: { walkProgress: [], upSpeed: 0, finishPos: position, advanceStopPos: position, beginPos: position },
                                        name: label || ((enemy ? "本地敌军" : "本地友军") + index),
                                        officialLevel: 1, playerId: playerId, playerLevel: 30 + index * 5,
                                        power: 40, serverId: 1, status: 1, upPower: 100, upPowerRecover: 0, upSpeed: 0,
                                        version: 1, walkEndDt: 0
                                    };
                                    offlineSave.world.nativeUnits.push(unit);
                                    py.updatePlayerBaseInfo([unit]);
                                    saveOfflineReplica();
                                    return unit;
                                }
                                function loadCities() {
                                    Object.keys(config.WorldEmpiresCityLO.Store).forEach(function (code) {
                                        py.updateCityInfo([{ owner: 0, code: Number(code), playerDefences: [], winDt: 0 }]);
                                    });
                                    offlineSave.world.citiesUnlocked = true;
                                    saveOfflineReplica();
                                }
                                window.OfflineNativeWorld.view = view;
                                window.OfflineNativeWorld.createUnit = function (enemy, label) {
                                    var unit = makeUnit(!!enemy, label);
                                    if (unit) Utils.MsgUtils.addMidMsg((enemy ? "敌军" : "友军") + "已生成在原生地图");
                                    return unit;
                                };
                                window.OfflineNativeWorld.loadCities = loadCities;
                                if (!offlineSave.world.nativeUnits.length) {
                                    for (var i = 0; i < 8; i++) makeUnit(i % 2 === 1);
                                } else {
                                    if (!offlineSave.world.nativeUnitsNearPlayerV10) {
                                        var mainEntity = view._mapField && view._mapField.getMainPlayer();
                                        var mainTile = mainEntity && mainEntity.tile;
                                        var nearbyNodes = view._mapField && view._mapField._astarGraph && view._mapField._astarGraph.legalNode || [];
                                        if (mainTile && nearbyNodes.length) {
                                            nearbyNodes = nearbyNodes.map(function (node) {
                                                return { x: Number(node.y !== undefined ? node.y : node.x), y: Number(node.x !== undefined ? node.x : node.y) };
                                            }).filter(function (node) {
                                                var distance = Math.abs(node.x - mainTile.x) + Math.abs(node.y - mainTile.y);
                                                return distance >= 3 && distance <= 14;
                                            }).sort(function (a, b) {
                                                return (Math.abs(a.x - mainTile.x) + Math.abs(a.y - mainTile.y)) - (Math.abs(b.x - mainTile.x) + Math.abs(b.y - mainTile.y));
                                            });
                                            offlineSave.world.nativeUnits.forEach(function (unit, index) {
                                                var position = nearbyNodes[Math.min(nearbyNodes.length - 1, index * 5)] || legalPosition(index + 1);
                                                unit.curPos = position;
                                                unit.campsitePos = position;
                                                unit.moveInfo = { walkProgress: [], upSpeed: 0, finishPos: position, advanceStopPos: position, beginPos: position };
                                                unit.status = 1;
                                                unit.walkEndDt = 0;
                                            });
                                            offlineSave.world.nativeUnitsNearPlayerV10 = true;
                                            saveOfflineReplica();
                                        }
                                    }
                                    offlineSave.world.nativeUnits.forEach(function (unit, index) {
                                        unit.guildId = index % 2 === 0 ? localGuildId : localGuildId + 1;
                                    });
                                    py.updatePlayerBaseInfo(offlineSave.world.nativeUnits);
                                }
                                py.index2FreeCloud = py.index2FreeCloud || {};
                                offlineSave.world.nativeUnits.forEach(function (unit) {
                                    if (unit.curPos && py.quickTile2Index) py.index2FreeCloud[py.quickTile2Index(unit.curPos.x, unit.curPos.y)] = true;
                                });
                                if (view.handleAllEntityVisStatus && view._mapField && typeof view._mapField.getAllEntities === "function") {
                                    view.handleAllEntityVisStatus();
                                }
                                if (offlineSave.world.citiesUnlocked) loadCities();
                                // The original skin hides these groups until server data
                                // arrives. Local data is ready now, so expose its own UI.
                                [view.gp_top_right, view.gp_btn_right_bottom, view.btn_state_book, view.gp_left,
                                 view.gp_btn_right, view.gp_btn_left, view.gp_scale, view.gp_btn_bottom].forEach(function (item) {
                                    if (item) item.visible = true;
                                });
                            };
                            if (!game.SlgMainView.prototype._offlineWalkWrapped) {
                                game.SlgMainView.prototype._offlineWalkWrapped = true;
                                game.SlgMainView.prototype.walkToTile = function (x, y) {
                                    var view = this;
                                    var entity = view._mapField && view._mapField.getMainPlayer();
                                    var info = view.proxy && view.proxy.myBaseInfo;
                                    if (!entity || !info) return Utils.MsgUtils.addMidMsg("本地队伍尚未加载完成");
                                    var target = { x: x, y: y };
                                    var path = view._mapField.calculateWalkPath(entity, target);
                                    if (!path || !path.length) return Utils.MsgUtils.addMidMsg("该位置无法到达");
                                    var moved = Utils.deepClone(info);
                                    moved.status = game.WEPlayerStatus.Walk;
                                    moved.moveInfo = { beginPos: moved.curPos, finishPos: target, walkProgress: path, advanceStopPos: path[path.length - 1] };
                                    moved.walkEndDt = Utils.TimerManager.getServerTime() + path.length * Number(view.proxy.getConstValue("WEMoveUseDt"));
                                    view.proxy.updatePlayerBaseInfo([moved]);
                                    offlineSave.world.playerPos = target;
                                    saveOfflineReplica();
                                    egret.setTimeout(function () {
                                        var arrived = Utils.deepClone(moved);
                                        arrived.status = 1;
                                        arrived.curPos = target;
                                        arrived.campsitePos = arrived.campsitePos || target;
                                        arrived.moveInfo = { beginPos: target, finishPos: target, walkProgress: [], advanceStopPos: target, upSpeed: 0 };
                                        arrived.walkEndDt = 0;
                                        view.proxy.updatePlayerBaseInfo([arrived]);
                                    }, view, Math.min(5000, Math.max(800, path.length * 120)));
                                };
                            }
                            if (!game.SlgMainView.prototype._offlineEnemyActionWrapped) {
                                game.SlgMainView.prototype._offlineEnemyActionWrapped = true;
                                var originalHandleEntity = game.SlgMainView.prototype.handleBtnOpprByEntity;
                                game.SlgMainView.prototype.handleBtnOpprByEntity = function (entity, actionConfig) {
                                    var candidate = entity && (entity.data || entity.baseInfo || {});
                                    var localPlayerId = game.GameMVC.playerPy && game.GameMVC.playerPy.playerInfo && game.GameMVC.playerPy.playerInfo.playerId;
                                    var isEnemyCamp = entity && !entity.isSameGuild && candidate && candidate.playerId && Number(candidate.playerId) !== Number(localPlayerId);
                                    if (isEnemyCamp) {
                                        var target = candidate;
                                        actionConfig = {
                                            dispearPowerCost: true,
                                            btns: [
                                                { name: "攻 打", cb: function () { window.OfflineNativeWorld.startBattle(target); return true; } },
                                                { name: "查 看", skinName: "skins.ButtonSkinBlueXiao1", cb: function () { window.OfflineNativeWorld.inspectEnemy(target); return false; } }
                                            ]
                                        };
                                    }
                                    return originalHandleEntity.call(this, entity, actionConfig);
                                };
                            }
                        }
                        game.GameMVC.slgMed.showSubView(game.SlgMediator.SV._MAIN);
                    } else {
                        console.error("[OFFLINE] SLG mediator unavailable");
                    }
                    if (game.GameMVC.loginMed && game.LoginMediator && game.LoginMediator.SV) {
                        game.GameMVC.loginMed.hideSubView(game.LoginMediator.SV.BEFORE_LOGIN);
                    }
                    console.log("[OFFLINE] mode opened", offlineMode);
                }).catch(function (err) {
                    codexOfflineStarting = false;
                    console.error("[OFFLINE] startup failed", err);
                });
            } else if (attempts > 120) {
                clearInterval(timer);
                codexOfflineStarting = false;
                console.error("[OFFLINE] Utils.enterMainOffLine unavailable");
            }
        }, 250);
    }

    function loadGame(callback) {
        loadScript(manifestJson.game, callback);
    }

    fetchAgent()
    setTimeout(showLogin, 1000);
</script>
</body>
